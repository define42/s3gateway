<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23161b22'/%3E%3Cpath d='M6 5 3 8l3 3M10 5l3 3-3 3' fill='none' stroke='%23f0f6fc' stroke-width='1.5'/%3E%3C/svg%3E">
  <title>S3 Gateway Login</title>
  <style>
    :root {
      --bg-0: #05070d;
      --bg-1: #0d1323;
      --bg-2: #101a33;
      --panel: rgba(16, 24, 46, 0.78);
      --panel-border: rgba(112, 153, 255, 0.24);
      --text: #e7ecf8;
      --muted: #9eb2ce;
      --accent: #3ab8ff;
      --accent-2: #6df5c8;
      --accent-soft: rgba(58, 184, 255, 0.18);
      --error: #ff8ea5;
      --input-bg: rgba(6, 12, 26, 0.75);
      --input-border: rgba(134, 171, 255, 0.26);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Sora", "IBM Plex Sans", "Avenir Next", "Trebuchet MS", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 500px at 12% -10%, rgba(58, 184, 255, 0.28), transparent 70%),
        radial-gradient(900px 420px at 88% 0%, rgba(109, 245, 200, 0.17), transparent 68%),
        linear-gradient(165deg, var(--bg-0) 0%, var(--bg-1) 46%, var(--bg-2) 100%);
      position: relative;
      overflow-x: hidden;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      z-index: -1;
      border-radius: 999px;
      filter: blur(56px);
      opacity: 0.7;
      pointer-events: none;
    }
    body::before {
      width: 280px;
      height: 280px;
      background: rgba(58, 184, 255, 0.34);
      top: 10%;
      right: 6%;
      animation: float-orb 9s ease-in-out infinite;
    }
    body::after {
      width: 220px;
      height: 220px;
      background: rgba(109, 245, 200, 0.22);
      bottom: 10%;
      left: 5%;
      animation: float-orb 10s ease-in-out infinite reverse;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 7vh 1rem 2.5rem;
      display: flex;
      justify-content: center;
    }
    .panel {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow:
        0 24px 80px rgba(2, 8, 22, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      animation: panel-in 220ms ease-out;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 2.8vw, 2rem);
      letter-spacing: 0.01em;
    }
    p { margin: 0.45rem 0; }
    .kicker {
      margin: 0 0 0.7rem;
      color: var(--accent-2);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
    }
    .muted { color: var(--muted); }
    .error {
      margin-top: 0.75rem;
      color: var(--error);
      font-weight: 600;
    }
    form {
      display: grid;
      gap: 0.9rem;
      margin-top: 1rem;
    }
    label {
      display: grid;
      gap: 0.4rem;
      font-weight: 600;
      font-size: 0.95rem;
    }
    input {
      width: 100%;
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 0.72rem 0.78rem;
      font-size: 1rem;
      color: var(--text);
      background: var(--input-bg);
      transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      transform: translateY(-1px);
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 0.7rem 1.2rem;
      font-size: 0.98rem;
      font-weight: 600;
      color: #04101f;
      background: linear-gradient(110deg, var(--accent) 0%, var(--accent-2) 100%);
      cursor: pointer;
      width: fit-content;
      transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
      box-shadow: 0 8px 28px rgba(58, 184, 255, 0.28);
    }
    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
      box-shadow: 0 12px 30px rgba(58, 184, 255, 0.32);
    }
    button:active {
      transform: translateY(0);
    }
    @media (max-width: 560px) {
      main {
        padding-top: 6vh;
      }
      .panel {
        padding: 1.15rem;
        border-radius: 14px;
      }
    }
    @keyframes panel-in {
      from {
        opacity: 0;
        transform: translateY(9px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes float-orb {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-10px) translateX(4px); }
    }

    /* GitHub Dark / Primer-inspired theme */
    :root {
      color-scheme: dark;
      --bg-0: #0d1117;
      --bg-1: #0d1117;
      --bg-2: #0d1117;
      --panel: #161b22;
      --panel-border: #30363d;
      --text: #f0f6fc;
      --muted: #8b949e;
      --accent: #2f81f7;
      --accent-2: #238636;
      --accent-soft: rgba(31, 111, 235, 0.3);
      --error: #ff7b72;
      --input-bg: #0d1117;
      --input-border: #30363d;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      line-height: 1.5;
      background: var(--bg-0);
    }
    body::before, body::after { display: none; }
    main {
      max-width: 380px;
      padding: 8vh 1rem 2.5rem;
    }
    .panel {
      padding: 1.25rem;
      border-radius: 6px;
      background: var(--panel);
      box-shadow: none;
      backdrop-filter: none;
      animation: none;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 0;
      text-align: center;
    }
    .kicker {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      margin: 0 auto 1rem;
      border: 1px solid #30363d;
      border-radius: 50%;
      color: #f0f6fc;
      background: #0d1117;
      font-size: 0;
      letter-spacing: 0;
    }
    .kicker::before {
      content: "<>";
      font: 700 1rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    h1 + .muted { text-align: center; }
    .error {
      padding: 0.75rem;
      border: 1px solid rgba(248, 81, 73, 0.4);
      border-radius: 6px;
      color: var(--error);
      background: rgba(248, 81, 73, 0.1);
    }
    form { gap: 1rem; }
    label {
      gap: 0.45rem;
      font-size: 0.875rem;
      font-weight: 600;
    }
    input {
      min-height: 34px;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      color: var(--text);
      background: var(--input-bg);
      box-shadow: inset 0 1px 0 rgba(1, 4, 9, 0.2);
      transform: none;
    }
    input:focus {
      border-color: #1f6feb;
      box-shadow: 0 0 0 3px var(--accent-soft);
      transform: none;
    }
    button {
      width: 100%;
      min-height: 34px;
      border: 1px solid rgba(240, 246, 252, 0.1);
      border-radius: 6px;
      padding: 0.5rem 1rem;
      color: #fff;
      background: #238636;
      box-shadow: 0 1px 0 rgba(1, 4, 9, 0.4);
      transform: none;
    }
    button:hover {
      background: #2ea043;
      box-shadow: 0 1px 0 rgba(1, 4, 9, 0.4);
      filter: none;
      transform: none;
    }
    button:focus-visible, input:focus-visible {
      outline: 2px solid #2f81f7;
      outline-offset: 2px;
    }
    @media (max-width: 560px) {
      main { padding-top: 2rem; }
      .panel { padding: 1rem; border-radius: 6px; }
      input, button { min-height: 44px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <p class="kicker">Operations Console</p>
      <h1>S3 Gateway Admin</h1>
      <p class="muted">Sign in with LDAP credentials.</p>
      <form method="post" action="/login">
        <label>
          LDAP Username
          <input type="text" name="username" autocomplete="username" value="{{.Username}}" required>
        </label>
        <label>
          LDAP Password
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Sign in</button>
      </form>
      {{if .Error}}
      <p class="error">{{.Error}}</p>
      {{end}}
    </section>
  </main>
</body>
</html>
