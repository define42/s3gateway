name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: ["main"]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: Run full integration benchmarks
        run: |
          go test -run '^$' \
            -bench '^BenchmarkFullIntegrationGateway(PutObject|GetObject)$' \
            -benchmem -count=3 -benchtime=3x ./... | tee benchmark.txt

      - name: Add benchmark summary
        run: |
          echo "## Gateway Benchmarks" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep '^BenchmarkFullIntegrationGateway' benchmark.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.txt
