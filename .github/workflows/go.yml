name: Go

on:
  push:
    branches: ["main"]
    tags-ignore:
      - "v*"
  pull_request:
    branches: ["main"]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify go.mod is tidy
        run: make tidy-check

      - name: Lint
        run: make lint

      - name: Run Docker-free tests with coverage
        run: |
          cover_packages=$(go list ./cmd/s3gateway ./internal/... | grep -v '/internal/testutil$' | paste -sd, -)
          go test -race -shuffle=on -count=1 ./... \
            -coverprofile=coverage-unit.out -covermode=atomic -coverpkg="$cover_packages"

      - name: Show unit coverage in job summary
        run: |
          go tool cover -func=coverage-unit.out | tee coverage-unit.txt
          echo "## Go Unit Test Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage-unit.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-unit.out
          flags: unit
          fail_ci_if_error: true

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run Docker-backed tests with coverage
        run: |
          cover_packages=$(go list ./internal/... | grep -v '/internal/testutil$' | paste -sd, -)
          go test -race -tags=integration -shuffle=on -count=1 \
            ./internal/app ./internal/server ./internal/ldap \
            -coverprofile=coverage-integration.out -covermode=atomic -coverpkg="$cover_packages"

      - name: Show integration coverage in job summary
        run: |
          go tool cover -func=coverage-integration.out | tee coverage-integration.txt
          echo "## Go Integration Test Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage-integration.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-integration.out
          flags: integration
          fail_ci_if_error: true

  release:
    name: Release
    if: github.event_name == 'push'
    needs: [unit, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Bump version and create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main

      - name: Create GitHub release
        if: steps.tag.outputs.new_tag != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: Release ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.new_tag }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
